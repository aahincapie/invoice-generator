<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html,body{font-family:'Inter',system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f3f4f6}
  </style>
</head>
<body class="p-6">
  <div class="max-w-7xl mx-auto">
    <div class="mb-6 flex items-center justify-between">
      <h1 class="text-3xl font-bold text-slate-800">Invoice Dashboard</h1>
      <a href="index.html" class="px-4 py-2 rounded-lg bg-sky-600 text-white font-semibold hover:bg-sky-700">
        Create New Invoice
      </a>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-lg shadow p-6">
        <p class="text-sm text-slate-500 mb-1">Total Invoices</p>
        <p id="total-count" class="text-3xl font-bold text-slate-800">0</p>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <p class="text-sm text-slate-500 mb-1">Draft</p>
        <p id="draft-count" class="text-3xl font-bold text-yellow-600">0</p>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <p class="text-sm text-slate-500 mb-1">Sent</p>
        <p id="sent-count" class="text-3xl font-bold text-blue-600">0</p>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <p class="text-sm text-slate-500 mb-1">Paid</p>
        <p id="paid-count" class="text-3xl font-bold text-green-600">0</p>
      </div>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-lg shadow p-4 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <select id="status-filter" class="rounded-lg border border-slate-300 px-3 py-2">
          <option value="">All Statuses</option>
          <option value="draft">Draft</option>
          <option value="sent">Sent</option>
          <option value="paid">Paid</option>
        </select>
        <input type="text" id="search-input" placeholder="Search by invoice #, client..." class="rounded-lg border border-slate-300 px-3 py-2"/>
        <button id="refresh-btn" class="px-4 py-2 rounded-lg bg-slate-600 text-white font-semibold hover:bg-slate-700">
          Refresh
        </button>
      </div>
    </div>

    <!-- Invoices Table -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
      <table class="w-full">
        <thead class="bg-slate-50 border-b border-slate-200">
          <tr>
            <th class="text-left p-4 text-sm font-semibold text-slate-700">Invoice #</th>
            <th class="text-left p-4 text-sm font-semibold text-slate-700">Client</th>
            <th class="text-left p-4 text-sm font-semibold text-slate-700">Date</th>
            <th class="text-left p-4 text-sm font-semibold text-slate-700">Due Date</th>
            <th class="text-right p-4 text-sm font-semibold text-slate-700">Amount</th>
            <th class="text-left p-4 text-sm font-semibold text-slate-700">Status</th>
            <th class="text-center p-4 text-sm font-semibold text-slate-700">Actions</th>
          </tr>
        </thead>
        <tbody id="invoices-table-body">
          <tr>
            <td colspan="7" class="p-8 text-center text-slate-500">Loading invoices...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Supabase Connection Status -->
    <div id="connection-status" class="mt-4 p-4 rounded-lg bg-yellow-50 border border-yellow-200 text-yellow-800 text-sm">
      <strong>Note:</strong> Configure Supabase credentials in index.html to enable cloud sync. Currently showing local data only.
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://fwpadfroagpzkmcxzppq.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY_HERE'; // Replace with actual key
    let supabase = null;

    // Initialize Supabase if credentials are provided
    if (SUPABASE_ANON_KEY !== 'YOUR_ANON_KEY_HERE') {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      document.getElementById('connection-status').classList.add('hidden');
    }

    const STORAGE_KEY = 'invoices-7zones';
    let allInvoices = [];

    // Load invoices from localStorage and Supabase
    async function loadInvoices() {
      // Load from localStorage
      const localInvoices = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

      // Try to load from Supabase
      if (supabase) {
        try {
          const { data, error } = await supabase
            .from('invoices')
            .select('*')
            .order('created_at', { ascending: false });

          if (error) {
            console.error('Supabase error:', error);
            allInvoices = localInvoices;
          } else {
            // Merge Supabase data with local data
            allInvoices = data.map(inv => ({
              id: inv.id,
              invoiceNumber: inv.invoice_number,
              invoiceDate: inv.invoice_date,
              dueDate: inv.due_date,
              billTo: inv.bill_to,
              shipTo: inv.ship_to,
              notes: inv.notes,
              tax: inv.tax,
              paymentDetails: inv.payment_details,
              currency: inv.currency,
              totalAmount: inv.total_amount,
              items: inv.items,
              logo: inv.logo,
              signature: inv.signature,
              status: inv.status,
              createdAt: inv.created_at
            }));
          }
        } catch (err) {
          console.error('Supabase error:', err);
          allInvoices = localInvoices;
        }
      } else {
        allInvoices = localInvoices;
      }

      updateStats();
      renderInvoices(allInvoices);
    }

    // Update statistics
    function updateStats() {
      const total = allInvoices.length;
      const draft = allInvoices.filter(inv => inv.status === 'draft').length;
      const sent = allInvoices.filter(inv => inv.status === 'sent').length;
      const paid = allInvoices.filter(inv => inv.status === 'paid').length;

      document.getElementById('total-count').textContent = total;
      document.getElementById('draft-count').textContent = draft;
      document.getElementById('sent-count').textContent = sent;
      document.getElementById('paid-count').textContent = paid;
    }

    // Render invoices table
    function renderInvoices(invoices) {
      const tbody = document.getElementById('invoices-table-body');

      if (invoices.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-500">No invoices found</td></tr>';
        return;
      }

      tbody.innerHTML = invoices.map(inv => {
        const clientName = (inv.billTo || '').split('\n')[0];
        const statusColors = {
          draft: 'bg-yellow-100 text-yellow-800',
          sent: 'bg-blue-100 text-blue-800',
          paid: 'bg-green-100 text-green-800'
        };
        const statusColor = statusColors[inv.status] || 'bg-gray-100 text-gray-800';

        return `
          <tr class="border-b border-slate-100 hover:bg-slate-50">
            <td class="p-4 font-semibold text-slate-800">#${inv.invoiceNumber || '—'}</td>
            <td class="p-4 text-slate-600">${clientName || 'No client'}</td>
            <td class="p-4 text-slate-600">${inv.invoiceDate || '—'}</td>
            <td class="p-4 text-slate-600">${inv.dueDate || '—'}</td>
            <td class="p-4 text-right font-semibold text-slate-800">${inv.currency || 'USD'} ${inv.totalAmount?.toFixed(2) || '0.00'}</td>
            <td class="p-4">
              <select class="status-select px-3 py-1 rounded-full text-sm font-medium ${statusColor}" data-id="${inv.id}" data-invoice-number="${inv.invoiceNumber}">
                <option value="draft" ${inv.status === 'draft' ? 'selected' : ''}>Draft</option>
                <option value="sent" ${inv.status === 'sent' ? 'selected' : ''}>Sent</option>
                <option value="paid" ${inv.status === 'paid' ? 'selected' : ''}>Paid</option>
              </select>
            </td>
            <td class="p-4 text-center">
              <button class="view-btn text-sky-600 hover:underline text-sm font-medium" data-id="${inv.id}">View</button>
            </td>
          </tr>
        `;
      }).join('');

      // Add event listeners for status changes
      document.querySelectorAll('.status-select').forEach(select => {
        select.addEventListener('change', async (e) => {
          const id = e.target.dataset.id;
          const invoiceNumber = e.target.dataset.invoiceNumber;
          const newStatus = e.target.value;
          await updateInvoiceStatus(id, invoiceNumber, newStatus);
        });
      });

      // Add event listeners for view buttons
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.target.dataset.id;
          viewInvoice(id);
        });
      });
    }

    // Update invoice status
    async function updateInvoiceStatus(id, invoiceNumber, newStatus) {
      // Update in Supabase if available
      if (supabase) {
        try {
          const { error } = await supabase
            .from('invoices')
            .update({ status: newStatus })
            .eq('id', id);

          if (error) {
            console.error('Error updating status:', error);
            alert('Failed to update status in cloud');
          }
        } catch (err) {
          console.error('Error:', err);
        }
      }

      // Update in localStorage
      const localInvoices = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const index = localInvoices.findIndex(inv => inv.id === id);
      if (index !== -1) {
        localInvoices[index].status = newStatus;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(localInvoices));
      }

      // Reload invoices
      await loadInvoices();
    }

    // View invoice details
    function viewInvoice(id) {
      const invoice = allInvoices.find(inv => inv.id === id);
      if (!invoice) {
        alert('Invoice not found');
        return;
      }

      // For now, show alert with invoice details
      // TODO: Create a modal or navigate to invoice page
      const details = `
Invoice #${invoice.invoiceNumber}
Client: ${(invoice.billTo || '').split('\n')[0]}
Date: ${invoice.invoiceDate}
Amount: ${invoice.currency} ${invoice.totalAmount?.toFixed(2)}
Status: ${invoice.status}
      `;
      alert(details);

      // Alternative: Open in new tab with invoice loaded
      // window.open(`index.html?invoice=${id}`, '_blank');
    }

    // Filter invoices
    function filterInvoices() {
      const statusFilter = document.getElementById('status-filter').value;
      const searchTerm = document.getElementById('search-input').value.toLowerCase();

      let filtered = allInvoices;

      if (statusFilter) {
        filtered = filtered.filter(inv => inv.status === statusFilter);
      }

      if (searchTerm) {
        filtered = filtered.filter(inv => {
          const invoiceNum = (inv.invoiceNumber || '').toLowerCase();
          const client = (inv.billTo || '').toLowerCase();
          return invoiceNum.includes(searchTerm) || client.includes(searchTerm);
        });
      }

      renderInvoices(filtered);
    }

    // Event listeners
    document.getElementById('status-filter').addEventListener('change', filterInvoices);
    document.getElementById('search-input').addEventListener('input', filterInvoices);
    document.getElementById('refresh-btn').addEventListener('click', loadInvoices);

    // Initial load
    loadInvoices();
  </script>
</body>
</html>
